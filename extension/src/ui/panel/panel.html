<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redaction Gate</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #12161c;
        --muted: #5b6472;
        --line: #e3e7ee;
        --panel: #f4f6f9;
        --accent: #1b6feb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14181e;
          --fg: #e7ebf1;
          --muted: #98a2b3;
          --line: #29313b;
          --panel: #1b212a;
          --accent: #5c9dff;
        }
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        font:
          13px/1.45 system-ui,
          sans-serif;
        color: var(--fg);
        background: var(--bg);
        /* The panel is a column a few hundred pixels wide. Nothing in it may push
           sideways -- a horizontal scrollbar on a docked panel eats a tenth of the
           width it has. */
        overflow: hidden;
      }

      /* The tab strip. Three surfaces that used to be a popup and two browser tabs. */
      nav {
        display: flex;
        flex: 0 0 auto;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      nav button {
        flex: 1;
        padding: 9px 6px;
        border: 0;
        border-bottom: 2px solid transparent;
        background: none;
        color: var(--muted);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      nav button:hover {
        color: var(--fg);
      }
      nav button[aria-selected='true'] {
        color: var(--accent);
        border-bottom-color: var(--accent);
        background: var(--bg);
      }
      nav button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }

      .views {
        flex: 1 1 auto;
        position: relative;
        min-height: 0;
      }
      /* Kept mounted, not re-created, once a view has been opened.
         The side-by-side view holds object URLs for frames that exist nowhere else in
         the session; tearing its document down to switch tabs would revoke them and the
         evidence would be gone the moment someone looked away from it. */
      iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: var(--bg);
      }
      iframe[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <nav role="tablist" aria-label="Redaction Gate">
      <button id="tab-agent" role="tab" aria-selected="true" aria-controls="view-agent">
        Agent
      </button>
      <button id="tab-sent" role="tab" aria-selected="false" aria-controls="view-sent">
        What was sent
      </button>
      <button
        id="tab-resources"
        role="tab"
        aria-selected="false"
        aria-controls="view-resources"
      >
        Resources
      </button>
    </nav>

    <div class="views">
      <!-- The agent view is the one that is always needed, so it is the only one loaded
           up front. The other two cost a document and a bus listener each and are worth
           nothing until someone looks at them. -->
      <iframe id="view-agent" role="tabpanel" title="Agent" src="agent.html"></iframe>
      <iframe id="view-sent" role="tabpanel" title="What was sent" hidden></iframe>
      <iframe id="view-resources" role="tabpanel" title="Resources" hidden></iframe>
    </div>

    <script src="panel.js"></script>
  </body>
</html>
