<!doctype html>
<!--
  The Agent tab of the side panel.

  Identical to popup.html except that it has no Evidence buttons, and that difference is
  the whole reason it exists: inside the panel those two buttons are navigation to
  sibling tabs the reader is already looking at.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redaction Gate — agent</title>
    <style>
      :root {
        --bg: #0d1117;
        --bg-elevated: #161b22;
        --bg-subtle: #21262d;
        --fg: #f0f6fc;
        --fg-muted: #8b949e;
        --line: #30363d;
        --line-subtle: #21262d;
        --panel: #161b22;
        --accent: #58a6ff;
        --accent-glow: rgba(88, 166, 255, 0.15);
        --accent-strong: #1f6feb;
        --ok: #3fb950;
        --ok-glow: rgba(63, 185, 80, 0.15);
        --bad: #f85149;
        --bad-glow: rgba(248, 81, 73, 0.15);
        --warn: #d29922;
        --warn-glow: rgba(210, 153, 34, 0.15);
        --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff;
          --bg-elevated: #f6f8fa;
          --bg-subtle: #eaeef2;
          --fg: #1f2328;
          --fg-muted: #656d76;
          --line: #d0d7de;
          --line-subtle: #eaeef2;
          --panel: #f6f8fa;
          --accent: #0969da;
          --accent-glow: rgba(9, 105, 218, 0.1);
          --accent-strong: #0550ae;
          --ok: #1a7f37;
          --ok-glow: rgba(26, 127, 55, 0.1);
          --bad: #cf222e;
          --bad-glow: rgba(207, 34, 46, 0.1);
          --warn: #9a6700;
          --warn-glow: rgba(154, 103, 0, 0.1);
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      body {
        width: 100%;
        height: 100%;
        max-height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: var(--font-sans);
        font-size: 13px;
        line-height: 1.45;
        color: var(--fg);
        background: var(--bg);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* Sticky Header */
      header.app-header {
        flex: 0 0 auto;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        background: var(--bg);
        border-bottom: 1px solid var(--line-subtle);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: -0.01em;
      }
      .brand-icon {
        width: 18px;
        height: 18px;
        color: var(--accent);
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 500;
        background: var(--bg-subtle);
        color: var(--fg-muted);
        border: 1px solid var(--line);
        text-transform: capitalize;
      }
      .status-pill::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--fg-muted);
      }
      .status-pill[data-status='running'] {
        background: var(--accent-glow);
        color: var(--accent);
        border-color: var(--accent);
      }
      .status-pill[data-status='running']::before {
        background: var(--accent);
        box-shadow: 0 0 8px var(--accent);
        animation: pulse 1.5s infinite;
      }
      .status-pill[data-status='failed'] {
        background: var(--bad-glow);
        color: var(--bad);
        border-color: var(--bad);
      }
      .status-pill[data-status='failed']::before {
        background: var(--bad);
      }
      .status-pill[data-status='stopped'] {
        background: var(--warn-glow);
        color: var(--warn);
        border-color: var(--warn);
      }
      .status-pill[data-status='stopped']::before {
        background: var(--warn);
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }

      /* Main Scroll Container */
      .app-main {
        flex: 1 1 auto;
        min-height: 0;
        padding: 12px 14px 130px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow-y: auto;
        overflow-x: hidden;
      }

      /* Tab Orientation Warning */
      #tab-note {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        background: var(--warn-glow);
        border: 1px solid var(--warn);
        color: var(--warn);
        font-size: 11.5px;
      }
      #tab-note[hidden] {
        display: none;
      }
      #show-tab {
        padding: 3px 8px;
        border-radius: 4px;
        border: 1px solid var(--warn);
        background: var(--bg);
        color: var(--warn);
        font-size: 11px;
        font-weight: 500;
        cursor: pointer;
      }

      /* Privacy Guarantee Banner */
      .counter-card {
        padding: 10px 12px;
        border-radius: 8px;
        background: var(--bg-elevated);
        border: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .counter-header {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--ok);
      }
      .counter-header svg {
        width: 13px;
        height: 13px;
      }
      .counter-body {
        font-size: 12px;
        color: var(--fg);
        font-variant-numeric: tabular-nums;
      }
      .counter-body strong {
        color: var(--fg);
        font-weight: 600;
      }
      .counter-body .zero {
        color: var(--ok);
        font-weight: 700;
      }
      #self-typed {
        font-size: 11px;
        color: var(--fg-muted);
      }

      /* Collapsible Diagnostics Accordion */
      details.diag-section {
        border-radius: 8px;
        background: var(--bg-elevated);
        border: 1px solid var(--line);
        overflow: hidden;
      }
      details.diag-section summary {
        padding: 8px 12px;
        font-size: 11.5px;
        font-weight: 500;
        color: var(--fg-muted);
        cursor: pointer;
        user-select: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      details.diag-section summary:hover {
        color: var(--fg);
      }
      .diag-content {
        padding: 8px 12px;
        border-top: 1px solid var(--line-subtle);
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 11.5px;
      }
      .diag-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .diag-pill {
        padding: 2px 6px;
        border-radius: 4px;
        background: var(--bg);
        border: 1px solid var(--line);
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--fg-muted);
      }
      .diag-pill[data-where='local'] { color: var(--warn); border-color: var(--warn); }
      .diag-pill[data-where='remote'] { color: var(--ok); border-color: var(--ok); }
      .diag-pill[data-access='granted'] { color: var(--ok); border-color: var(--ok); }
      .diag-pill[data-backend='webgpu'] { color: var(--ok); border-color: var(--ok); }
      .diag-pill[data-backend='wasm'] { color: var(--warn); border-color: var(--warn); }
      .diag-pill[data-backend='failed'] { color: var(--bad); border-color: var(--bad); }

      .btn-xs {
        padding: 3px 8px;
        border-radius: 4px;
        border: 1px solid var(--line);
        background: var(--bg-subtle);
        color: var(--fg);
        font-size: 11px;
        cursor: pointer;
        font-family: var(--font-sans);
      }
      .btn-xs:hover {
        background: var(--bg);
        border-color: var(--accent);
      }

      /* Toggle row */
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        color: var(--fg-muted);
      }
      .toggle-label {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }

      /* Step Feed */
      .steps-container {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .section-title {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--fg-muted);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #log {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #log:empty::after {
        content: 'No tasks executed yet. Type a command below.';
        display: block;
        padding: 24px 12px;
        text-align: center;
        color: var(--fg-muted);
        font-size: 12px;
        background: var(--bg-elevated);
        border-radius: 8px;
        border: 1px dashed var(--line);
      }
      #log li {
        background: var(--bg-elevated);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        transition: border-color 0.15s ease;
      }
      #log li:hover {
        border-color: var(--line);
      }
      .step-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      .step-idx-badge {
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 600;
        padding: 1px 5px;
        border-radius: 4px;
        background: var(--bg-subtle);
        color: var(--fg-muted);
      }
      .step-phase {
        font-size: 12px;
        font-weight: 500;
        flex: 1;
      }
      #log li[data-outcome='ok'] .step-phase { color: var(--ok); }
      #log li[data-outcome='failed'] .step-phase { color: var(--bad); }
      #log li[data-outcome='interrupted'] .step-phase,
      #log li[data-outcome='stopped'] .step-phase { color: var(--warn); }
      .step-ms {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--fg-muted);
      }
      .step-note {
        font-size: 11.5px;
        color: var(--fg-muted);
        line-height: 1.4;
        word-break: break-word;
      }
      .stages-waterfall {
        list-style: none;
        margin-top: 4px;
        padding-top: 4px;
        border-top: 1px solid var(--line-subtle);
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .stages-waterfall li {
        border: 0;
        padding: 1px 0;
        background: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 10.5px;
        color: var(--fg-muted);
      }

      /* Fixed Floating Chat Input Bar at Bottom */
      .chat-dock {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 8px 12px 12px;
        background: var(--bg);
        border-top: 1px solid var(--line-subtle);
        backdrop-filter: blur(12px);
        display: flex;
        flex-direction: column;
        gap: 6px;
        z-index: 20;
      }
      .input-wrapper {
        position: relative;
        display: flex;
        flex-direction: column;
        background: var(--bg-elevated);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 8px;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .input-wrapper:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-glow);
      }
      #goal {
        width: 100%;
        min-height: 48px;
        max-height: 120px;
        resize: none;
        border: 0;
        background: transparent;
        color: var(--fg);
        font-family: var(--font-sans);
        font-size: 13px;
        line-height: 1.45;
        outline: none;
      }
      #goal::placeholder {
        color: var(--fg-muted);
      }
      .input-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 4px;
      }
      .shortcut-hint {
        font-size: 11px;
        color: var(--fg-muted);
      }
      .action-btns {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .btn-primary {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 5px 12px;
        border-radius: 6px;
        border: 1px solid transparent;
        background: var(--accent-strong);
        color: #ffffff;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: opacity 0.15s ease, transform 0.1s ease;
      }
      .btn-primary:hover:not(:disabled) {
        opacity: 0.92;
        transform: translateY(-0.5px);
      }
      .btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-stop {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 5px 12px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--bg-subtle);
        color: var(--bad);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
      }
      .btn-stop:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      #coverage {
        font-size: 10.5px;
        color: var(--fg-muted);
        line-height: 1.35;
      }
      #coverage b {
        color: var(--warn);
      }
    </style>
  </head>
  <body>
    <!-- App Header -->
    <header class="app-header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10" />
          <path d="m9 12 2 2 4-4" />
        </svg>
        <span>Redaction Gate</span>
      </div>
      <span id="status" class="status-pill" data-status="idle">idle</span>
    </header>

    <!-- App Body -->
    <main class="app-main">
      <!-- Cross Tab Note -->
      <div id="tab-note" hidden>
        <span id="tab-note-text"></span>
        <button id="show-tab" type="button">Focus Tab</button>
      </div>

      <!-- Zero-Knowledge Guarantee Counter -->
      <div class="counter-card">
        <div class="counter-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          Zero-Knowledge Privacy
        </div>
        <p id="counter" class="counter-body">
          Protected this session: <strong id="redacted">0</strong> &middot; Transmitted: <strong class="zero">0</strong>
          <span id="self-typed" hidden></span>
        </p>
      </div>

      <!-- Quick Toggle -->
      <div class="toggle-row">
        <label class="toggle-label">
          <input id="overlay" type="checkbox" /> Live on-page overlay
        </label>
      </div>

      <!-- Collapsible System Diagnostics -->
      <details class="diag-section">
        <summary>
          <span>System Diagnostics</span>
          <span>&#9662;</span>
        </summary>
        <div class="diag-content">
          <div class="diag-row">
            <span>Planner</span>
            <span id="planner" class="diag-pill">unknown</span>
          </div>
          <div class="diag-row">
            <span>Local SLM</span>
            <span id="local-model" class="diag-pill">unknown</span>
          </div>
          <div class="diag-row">
            <span>Site Access</span>
            <span id="access" class="diag-pill">checking&hellip;</span>
            <button id="grant" class="btn-xs" type="button">Allow</button>
          </div>
          <div class="diag-row">
            <span>Inference Host</span>
            <span id="host" class="diag-pill">not started</span>
            <button id="selftest" class="btn-xs" type="button">Check</button>
          </div>
        </div>
      </details>

      <!-- Execution Step Stream -->
      <div class="steps-container">
        <div class="section-title">
          <span>Execution Stream</span>
        </div>
        <ol id="log"></ol>
      </div>
    </main>

    <!-- Bottom Input Dock -->
    <footer class="chat-dock">
      <div class="input-wrapper">
        <textarea id="goal" placeholder="Ask agent to act on this page (e.g. check all checkboxes, search...)" rows="2"></textarea>
        <div class="input-actions">
          <span class="shortcut-hint">&#x2318;+Enter to run</span>
          <div class="action-btns">
            <button id="stop" class="btn-stop" type="button" disabled>Stop</button>
            <button id="run" class="btn-primary" type="button">Run</button>
          </div>
        </div>
      </div>
      <div id="coverage"></div>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
