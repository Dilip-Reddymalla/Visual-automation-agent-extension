<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NetBanking — Transfer</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #ffffff;
        color: #14181e;
        font:
          12px/1.3 'Segoe UI',
          system-ui,
          sans-serif;
      }
      a {
        color: #00524d;
      }
      header.bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 9px 20px;
        background: #f4f7f6;
        border-bottom: 2px solid #00524d;
      }
      .brand {
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .crumb {
        font-size: 11px;
        color: #5b6472;
        padding: 6px 20px;
      }
      main {
        padding: 10px 20px;
        max-width: 1180px;
      }
      .cols {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      .cols > .side {
        flex: 0 0 190px;
      }
      .cols > .pane {
        flex: 1 1 auto;
        min-width: 0;
      }
      nav.side a {
        display: block;
        padding: 6px 10px;
        text-decoration: none;
        color: #14181e;
        border-left: 3px solid transparent;
      }
      nav.side a[aria-current] {
        border-left-color: #00524d;
        background: #f4f7f6;
      }
      section {
        margin-bottom: 10px;
      }
      fieldset {
        border: 1px solid #dde2ea;
        border-radius: 4px;
        padding: 10px;
        margin: 0 0 10px;
      }
      legend {
        padding: 0 6px;
        font-weight: 700;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #5b6472;
      }
      h1 {
        font-size: 19px;
        margin: 0 0 6px;
      }
      h2 {
        font-size: 15px;
        margin: 0 0 6px;
      }
      h3 {
        font-size: 13px;
        margin: 0 0 6px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }
      .grid.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .f {
        margin-bottom: 6px;
      }
      label {
        display: block;
        font-size: 10px;
        color: #5b6472;
        margin-bottom: 3px;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 6px 9px;
        border: 1px solid #dde2ea;
        border-radius: 3px;
        font: inherit;
        background: #fff;
        color: #14181e;
      }
      input[readonly] {
        background: #f4f7f6;
      }
      .hint {
        font-size: 10px;
        color: #5b6472;
        margin-top: 2px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11px;
      }
      th,
      td {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid #dde2ea;
        vertical-align: top;
      }
      th {
        background: #f4f7f6;
        font-weight: 600;
        color: #5b6472;
      }
      td.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      dl.kv {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 4px 6px;
        margin: 0;
      }
      dl.kv dt {
        color: #5b6472;
        font-size: 10px;
      }
      dl.kv dd {
        margin: 0;
      }
      .card {
        border: 1px solid #dde2ea;
        border-radius: 6px;
        padding: 10px;
        margin-bottom: 6px;
        background: #fff;
      }
      .pill {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 10px;
        background: #f4f7f6;
        color: #00524d;
        font-size: 10px;
        border: 1px solid #dde2ea;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 6px;
        flex-wrap: wrap;
      }
      button {
        padding: 6px 14px;
        border: 1px solid #dde2ea;
        border-radius: 3px;
        background: #f4f7f6;
        font: inherit;
        cursor: pointer;
        color: #14181e;
      }
      button.primary {
        background: #00524d;
        border-color: #00524d;
        color: #fff;
      }
      .muted {
        color: #5b6472;
      }
      .mono {
        font-family: 'Cascadia Mono', 'Consolas', monospace;
      }
      .scanwrap {
        background: #f4f7f6;
        padding: 10px;
        border: 1px solid #dde2ea;
      }
      .rail {
        flex: 0 0 260px;
      }
      footer {
        padding: 10px 20px;
        color: #5b6472;
        font-size: 10px;
        border-top: 1px solid #dde2ea;
      }
    </style>
  </head>
  <body data-corpus-id="syn-bank-transfer">
    <header class="bar">
      <div class="brand">NetBanking</div>
      <div>Logged in as <span data-pii="PERSON">Rekha Gowda</span></div>
    </header>
    <main>
      <div class="cols">
        <div class="side">
          <nav class="side">
            <a href="#0" data-el="1">Accounts</a
            ><a href="#1" data-el="1" aria-current="page">Transfer</a
            ><a href="#2" data-el="1">Bills</a><a href="#3" data-el="1">Cards</a
            ><a href="#4" data-el="1">Profile</a>
          </nav>
        </div>
        <div class="pane">
          <h1>Transfer funds</h1>
          <h3>Saved payees</h3>
          <table>
            <thead>
              <tr>
                <th>Payee</th>
                <th>Account</th>
                <th>IFSC</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><span data-pii="PERSON">Aditya Fernandes</span></td>
                <td><span data-pii="ACCOUNT">56142191469</span></td>
                <td><span data-pii="IFSC">UTIB0303721</span></td>
              </tr>
              <tr>
                <td><span data-pii="PERSON">Neha Iyer</span></td>
                <td><span data-pii="ACCOUNT">50704554051</span></td>
                <td><span data-pii="IFSC">ICIC0793264</span></td>
              </tr>
              <tr>
                <td><span data-pii="ORG">Kaveri Textiles Pvt Ltd</span></td>
                <td><span data-pii="ACCOUNT">33592053070491</span></td>
                <td>
                  <span
                    data-neg="CARD"
                    data-neg-why="a rupee amount whose grouping mimics a 16-digit card"
                    >Rs 4,532 1290 4471</span
                  >
                </td>
              </tr>
            </tbody>
          </table>
          <fieldset>
            <legend>New payee</legend>
            <div class="grid">
              <div class="f">
                <label>Payee name</label><input type="text" data-el="1" data-pii="PERSON" />
              </div>
              <div class="f">
                <label>Account number</label
                ><input type="text" data-el="1" data-pii="ACCOUNT" />
              </div>
              <div class="f">
                <label>IFSC</label><input type="text" data-el="1" data-pii="IFSC" />
                <div class="hint">
                  Example
                  <span
                    data-neg="CARD"
                    data-neg-why="a rupee amount whose grouping mimics a 16-digit card"
                    >Rs 5,100 2233 8890</span
                  >
                </div>
              </div>
              <div class="f"><label>Amount</label><input type="text" data-el="1" /></div>
            </div>
            <div class="f">
              <label>Transaction password</label
              ><input type="password" data-el="1" data-pii="SECRET" />
            </div>
          </fieldset>
          <div class="actions">
            <button class="" data-el="1">Cancel</button
            ><button class="primary" data-el="1">Transfer</button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
