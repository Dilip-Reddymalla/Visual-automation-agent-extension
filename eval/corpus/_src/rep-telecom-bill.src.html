<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Postpaid Bill</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #ffffff;
        color: #111827;
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      a {
        color: #4338ca;
      }
      header.bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 20px;
        background: #f9fafb;
        border-bottom: 2px solid #4338ca;
      }
      .brand {
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .crumb {
        font-size: 11px;
        color: #6b7280;
        padding: 6px 20px;
      }
      main {
        padding: 16px 20px;
        max-width: 1180px;
      }
      .cols {
        display: flex;
        gap: 16px;
        align-items: flex-start;
      }
      .cols > .side {
        flex: 0 0 190px;
      }
      .cols > .pane {
        flex: 1 1 auto;
        min-width: 0;
      }
      nav.side a {
        display: block;
        padding: 9px 10px;
        text-decoration: none;
        color: #111827;
        border-left: 3px solid transparent;
      }
      nav.side a[aria-current] {
        border-left-color: #4338ca;
        background: #f9fafb;
      }
      section {
        margin-bottom: 16px;
      }
      fieldset {
        border: 1px solid #e5e7eb;
        border-radius: 4px;
        padding: 13px;
        margin: 0 0 16px;
      }
      legend {
        padding: 0 6px;
        font-weight: 700;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #6b7280;
      }
      h1 {
        font-size: 21px;
        margin: 0 0 12px;
      }
      h2 {
        font-size: 17px;
        margin: 0 0 12px;
      }
      h3 {
        font-size: 15px;
        margin: 0 0 6px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .grid.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .f {
        margin-bottom: 12px;
      }
      label {
        display: block;
        font-size: 12px;
        color: #6b7280;
        margin-bottom: 3px;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 9px 9px;
        border: 1px solid #e5e7eb;
        border-radius: 3px;
        font: inherit;
        background: #fff;
        color: #111827;
      }
      input[readonly] {
        background: #f9fafb;
      }
      .hint {
        font-size: 11px;
        color: #6b7280;
        margin-top: 2px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th,
      td {
        text-align: left;
        padding: 9px 8px;
        border-bottom: 1px solid #e5e7eb;
        vertical-align: top;
      }
      th {
        background: #f9fafb;
        font-weight: 600;
        color: #6b7280;
      }
      td.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      dl.kv {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 4px 12px;
        margin: 0;
      }
      dl.kv dt {
        color: #6b7280;
        font-size: 12px;
      }
      dl.kv dd {
        margin: 0;
      }
      .card {
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        padding: 13px;
        margin-bottom: 12px;
        background: #fff;
      }
      .pill {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 10px;
        background: #f9fafb;
        color: #4338ca;
        font-size: 11px;
        border: 1px solid #e5e7eb;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      button {
        padding: 9px 14px;
        border: 1px solid #e5e7eb;
        border-radius: 3px;
        background: #f9fafb;
        font: inherit;
        cursor: pointer;
        color: #111827;
      }
      button.primary {
        background: #4338ca;
        border-color: #4338ca;
        color: #fff;
      }
      .muted {
        color: #6b7280;
      }
      .mono {
        font-family: 'Cascadia Mono', 'Consolas', monospace;
      }
      .scanwrap {
        background: #f9fafb;
        padding: 16px;
        border: 1px solid #e5e7eb;
      }
      .rail {
        flex: 0 0 260px;
      }
      footer {
        padding: 16px 20px;
        color: #6b7280;
        font-size: 11px;
        border-top: 1px solid #e5e7eb;
      }
    </style>
  </head>
  <body data-corpus-id="rep-telecom-bill">
    <style>
      .lvl0,
      .lvl1,
      .lvl2,
      .lvl3,
      .lvl4,
      .lvl5,
      .lvl6 {
        display: block;
      }
      .rowf {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .fake-label {
        flex: 0 0 190px;
        color: #5b6472;
        font-size: 0.85em;
        text-align: right;
      }
      .rowf input {
        flex: 1 1 auto;
      }
      .fake-hint {
        flex: 0 0 auto;
        color: #8b95a3;
        font-size: 0.8em;
      }
      table.kvtable td {
        border-bottom: 1px dotted #dfe4ec;
        padding: 5px 8px;
      }
      table.kvtable td.k {
        color: #5b6472;
        width: 220px;
        font-size: 0.88em;
      }
      .divbtn {
        display: inline-block;
        padding: 7px 14px;
        border: 1px solid #c9d0da;
        border-radius: 3px;
        background: #eef2f7;
        cursor: pointer;
        user-select: none;
      }
      .tabs {
        display: flex;
        gap: 2px;
        border-bottom: 2px solid #c9d0da;
        margin-bottom: 12px;
      }
      .tabs [role='tab'] {
        padding: 7px 14px;
        cursor: pointer;
        background: #f2f5f9;
      }
      .tabs [role='tab'][aria-selected='true'] {
        background: #fff;
        font-weight: 600;
      }
      .marquee {
        background: #fffbe6;
        border: 1px solid #f0e0a0;
        padding: 6px 10px;
        font-size: 0.85em;
        margin-bottom: 10px;
      }
    </style>

    <header class="bar">
      <div class="brand">Telecom</div>
      <div>
        <span data-neg="PHONE" data-neg-why="ten digits that happen to be an amount in paise"
          >Bill amount 9845012345</span
        >
      </div>
    </header>
    <main>
      <div class="cols">
        <div class="side">
          <nav class="side">
            <a href="#0" data-el="1">Overview</a
            ><a href="#1" data-el="1" aria-current="page">Bills</a
            ><a href="#2" data-el="1">Plans</a><a href="#3" data-el="1">Support</a>
          </nav>
        </div>
        <div class="pane">
          <div class="lvl4">
            <div class="lvl3">
              <div class="lvl2">
                <div class="lvl1">
                  <div class="lvl0">
                    <h1>Postpaid account</h1>
                    <div class="rowf">
                      <span class="fake-label">Account holder</span
                      ><input
                        type="text"
                        name="accountholder"
                        value="Kavya Chatterjee"
                        placeholder="Account holder"
                        data-el="1"
                        data-pii="PERSON"
                      />
                    </div>
                    <div class="rowf">
                      <span class="fake-label">Billing address</span
                      ><input
                        type="text"
                        name="billingaddress"
                        value="135, SV Road, Andheri West, Bengaluru, Karnataka 560041"
                        placeholder="Billing address"
                        data-el="1"
                        data-pii="ADDRESS"
                      />
                    </div>
                    <div class="rowf">
                      <span class="fake-label">Alternate contact</span
                      ><input
                        type="text"
                        name="alternatecontact"
                        value="8542176621"
                        placeholder="Alternate contact"
                        data-el="1"
                        data-pii="PHONE"
                      />
                    </div>
                    <div class="rowf">
                      <span class="fake-label">Email for bills</span
                      ><input
                        type="text"
                        name="emailforbills"
                        value="arjun.joshi@mail.example.org"
                        placeholder="Email for bills"
                        data-el="1"
                        data-pii="EMAIL"
                      />
                    </div>
                    <div class="rowf">
                      <span class="fake-label">Autopay card</span
                      ><input
                        type="text"
                        name="autopaycard"
                        value="6521 9618 3157 1666"
                        placeholder="Autopay card"
                        data-el="1"
                        data-pii="CARD"
                      />
                    </div>
                    <div class="rowf">
                      <span class="fake-label">Autopay UPI</span
                      ><input
                        type="text"
                        name="autopayupi"
                        value="priya.mishra@apl"
                        placeholder="Autopay UPI"
                        data-el="1"
                        data-pii="UPI"
                      />
                    </div>
                    <p>
                      Bills are emailed to
                      <span data-pii="EMAIL">arjun.banerjee@example.in</span> on the 3rd.
                      Account
                      <span data-neg="EMAIL" data-neg-why="a support desk, not a person"
                        >support@example.in</span
                      >.
                    </p>
                    <div>
                      <div role="button" tabindex="0" class="divbtn" data-el="1">Save</div>
                      <div role="button" tabindex="0" class="divbtn" data-el="1">Submit</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
