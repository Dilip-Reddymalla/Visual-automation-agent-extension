<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>University Admission</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #ffffff;
        color: #111827;
        font:
          15px/1.5 system-ui,
          sans-serif;
      }
      a {
        color: #4338ca;
      }
      header.bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 20px;
        background: #f9fafb;
        border-bottom: 2px solid #4338ca;
      }
      .brand {
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .crumb {
        font-size: 12px;
        color: #6b7280;
        padding: 6px 20px;
      }
      main {
        padding: 16px 20px;
        max-width: 1180px;
      }
      .cols {
        display: flex;
        gap: 16px;
        align-items: flex-start;
      }
      .cols > .side {
        flex: 0 0 190px;
      }
      .cols > .pane {
        flex: 1 1 auto;
        min-width: 0;
      }
      nav.side a {
        display: block;
        padding: 9px 10px;
        text-decoration: none;
        color: #111827;
        border-left: 3px solid transparent;
      }
      nav.side a[aria-current] {
        border-left-color: #4338ca;
        background: #f9fafb;
      }
      section {
        margin-bottom: 16px;
      }
      fieldset {
        border: 1px solid #e5e7eb;
        border-radius: 4px;
        padding: 13px;
        margin: 0 0 16px;
      }
      legend {
        padding: 0 6px;
        font-weight: 700;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #6b7280;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 12px;
      }
      h2 {
        font-size: 18px;
        margin: 0 0 12px;
      }
      h3 {
        font-size: 16px;
        margin: 0 0 6px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .grid.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .f {
        margin-bottom: 12px;
      }
      label {
        display: block;
        font-size: 13px;
        color: #6b7280;
        margin-bottom: 3px;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 9px 9px;
        border: 1px solid #e5e7eb;
        border-radius: 3px;
        font: inherit;
        background: #fff;
        color: #111827;
      }
      input[readonly] {
        background: #f9fafb;
      }
      .hint {
        font-size: 12px;
        color: #6b7280;
        margin-top: 2px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th,
      td {
        text-align: left;
        padding: 9px 8px;
        border-bottom: 1px solid #e5e7eb;
        vertical-align: top;
      }
      th {
        background: #f9fafb;
        font-weight: 600;
        color: #6b7280;
      }
      td.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      dl.kv {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 4px 12px;
        margin: 0;
      }
      dl.kv dt {
        color: #6b7280;
        font-size: 13px;
      }
      dl.kv dd {
        margin: 0;
      }
      .card {
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        padding: 13px;
        margin-bottom: 12px;
        background: #fff;
      }
      .pill {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 10px;
        background: #f9fafb;
        color: #4338ca;
        font-size: 12px;
        border: 1px solid #e5e7eb;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      button {
        padding: 9px 14px;
        border: 1px solid #e5e7eb;
        border-radius: 3px;
        background: #f9fafb;
        font: inherit;
        cursor: pointer;
        color: #111827;
      }
      button.primary {
        background: #4338ca;
        border-color: #4338ca;
        color: #fff;
      }
      .muted {
        color: #6b7280;
      }
      .mono {
        font-family: 'Cascadia Mono', 'Consolas', monospace;
      }
      .scanwrap {
        background: #f9fafb;
        padding: 16px;
        border: 1px solid #e5e7eb;
      }
      .rail {
        flex: 0 0 260px;
      }
      footer {
        padding: 16px 20px;
        color: #6b7280;
        font-size: 12px;
        border-top: 1px solid #e5e7eb;
      }
    </style>
  </head>
  <body data-corpus-id="rep-univ-admission">
    <style>
      .lvl0,
      .lvl1,
      .lvl2,
      .lvl3,
      .lvl4,
      .lvl5,
      .lvl6 {
        display: block;
      }
      .rowf {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .fake-label {
        flex: 0 0 190px;
        color: #5b6472;
        font-size: 0.85em;
        text-align: right;
      }
      .rowf input {
        flex: 1 1 auto;
      }
      .fake-hint {
        flex: 0 0 auto;
        color: #8b95a3;
        font-size: 0.8em;
      }
      table.kvtable td {
        border-bottom: 1px dotted #dfe4ec;
        padding: 5px 8px;
      }
      table.kvtable td.k {
        color: #5b6472;
        width: 220px;
        font-size: 0.88em;
      }
      .divbtn {
        display: inline-block;
        padding: 7px 14px;
        border: 1px solid #c9d0da;
        border-radius: 3px;
        background: #eef2f7;
        cursor: pointer;
        user-select: none;
      }
      .tabs {
        display: flex;
        gap: 2px;
        border-bottom: 2px solid #c9d0da;
        margin-bottom: 12px;
      }
      .tabs [role='tab'] {
        padding: 7px 14px;
        cursor: pointer;
        background: #f2f5f9;
      }
      .tabs [role='tab'][aria-selected='true'] {
        background: #fff;
        font-weight: 600;
      }
      .marquee {
        background: #fffbe6;
        border: 1px solid #f0e0a0;
        padding: 6px 10px;
        font-size: 0.85em;
        margin-bottom: 10px;
      }
    </style>

    <header class="bar">
      <div class="brand">State University</div>
      <div>
        <span
          data-neg="GSTIN"
          data-neg-why="the GSTIN the government&#x27;s own documentation uses as an example"
          >29AAAAA0000A1Z5</span
        >
      </div>
    </header>
    <main>
      <div class="cols">
        <div class="side">
          <nav class="side">
            <a href="#0" data-el="1">Apply</a
            ><a href="#1" data-el="1" aria-current="page">Documents</a
            ><a href="#2" data-el="1">Fee</a><a href="#3" data-el="1">Status</a>
          </nav>
        </div>
        <div class="pane">
          <div class="lvl4">
            <div class="lvl3">
              <div class="lvl2">
                <div class="lvl1">
                  <div class="lvl0">
                    <h1>Admission form</h1>
                    <div class="rowf">
                      <span class="fake-label">Candidate name</span
                      ><input
                        type="text"
                        name="candidatename"
                        value="Kavya Khan"
                        placeholder="Candidate name"
                        data-el="1"
                        data-pii="PERSON"
                      />
                    </div>
                    <div class="rowf">
                      <span class="fake-label">Date of birth</span
                      ><input
                        type="text"
                        name="dateofbirth"
                        value="21/01/2003"
                        placeholder="Date of birth"
                        data-el="1"
                        data-pii="DOB"
                      />
                    </div>
                    <div class="rowf">
                      <span class="fake-label">Aadhaar</span
                      ><input
                        type="text"
                        name="aadhaar"
                        value="8446 6796 6208"
                        placeholder="Aadhaar"
                        data-el="1"
                        data-pii="AADHAAR"
                      />
                    </div>
                    <div class="rowf">
                      <span class="fake-label">Guardian mobile</span
                      ><input
                        type="text"
                        name="guardianmobile"
                        value="06870 352424"
                        placeholder="Guardian mobile"
                        data-el="1"
                        data-pii="PHONE"
                      />
                    </div>
                    <div class="rowf">
                      <span class="fake-label">Correspondence address</span
                      ><input
                        type="text"
                        name="correspondenceaddress"
                        value="147, Salt Lake Sector V, Hyderabad, Telangana 500034"
                        placeholder="Correspondence address"
                        data-el="1"
                        data-pii="ADDRESS"
                      />
                    </div>
                    <div class="rowf">
                      <span class="fake-label">Fee account</span
                      ><input
                        type="text"
                        name="feeaccount"
                        value="67525338483136"
                        placeholder="Fee account"
                        data-el="1"
                        data-pii="ACCOUNT"
                      />
                    </div>
                    <p>
                      Admit cards go to
                      <span data-pii="EMAIL">farhan.chatterjee@example.in</span>. Helpdesk
                      <span data-neg="PHONE" data-neg-why="a postal code, six digits"
                        >PIN 560041</span
                      >, or call <span data-pii="PHONE">+91 60209 38695</span>.
                    </p>
                    <div>
                      <div role="button" tabindex="0" class="divbtn" data-el="1">Save</div>
                      <div role="button" tabindex="0" class="divbtn" data-el="1">Submit</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
