<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Intimate a Claim</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #ffffff;
        color: #111827;
        font:
          13px/1.3 system-ui,
          sans-serif;
      }
      a {
        color: #4338ca;
      }
      header.bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 9px 20px;
        background: #f9fafb;
        border-bottom: 2px solid #4338ca;
      }
      .brand {
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .crumb {
        font-size: 11px;
        color: #6b7280;
        padding: 6px 20px;
      }
      main {
        padding: 10px 20px;
        max-width: 1180px;
      }
      .cols {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      .cols > .side {
        flex: 0 0 190px;
      }
      .cols > .pane {
        flex: 1 1 auto;
        min-width: 0;
      }
      nav.side a {
        display: block;
        padding: 6px 10px;
        text-decoration: none;
        color: #111827;
        border-left: 3px solid transparent;
      }
      nav.side a[aria-current] {
        border-left-color: #4338ca;
        background: #f9fafb;
      }
      section {
        margin-bottom: 10px;
      }
      fieldset {
        border: 1px solid #e5e7eb;
        border-radius: 4px;
        padding: 10px;
        margin: 0 0 10px;
      }
      legend {
        padding: 0 6px;
        font-weight: 700;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #6b7280;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 6px;
      }
      h2 {
        font-size: 16px;
        margin: 0 0 6px;
      }
      h3 {
        font-size: 14px;
        margin: 0 0 6px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }
      .grid.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .f {
        margin-bottom: 6px;
      }
      label {
        display: block;
        font-size: 11px;
        color: #6b7280;
        margin-bottom: 3px;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 6px 9px;
        border: 1px solid #e5e7eb;
        border-radius: 3px;
        font: inherit;
        background: #fff;
        color: #111827;
      }
      input[readonly] {
        background: #f9fafb;
      }
      .hint {
        font-size: 10px;
        color: #6b7280;
        margin-top: 2px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      th,
      td {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid #e5e7eb;
        vertical-align: top;
      }
      th {
        background: #f9fafb;
        font-weight: 600;
        color: #6b7280;
      }
      td.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      dl.kv {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 4px 6px;
        margin: 0;
      }
      dl.kv dt {
        color: #6b7280;
        font-size: 11px;
      }
      dl.kv dd {
        margin: 0;
      }
      .card {
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        padding: 10px;
        margin-bottom: 6px;
        background: #fff;
      }
      .pill {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 10px;
        background: #f9fafb;
        color: #4338ca;
        font-size: 10px;
        border: 1px solid #e5e7eb;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 6px;
        flex-wrap: wrap;
      }
      button {
        padding: 6px 14px;
        border: 1px solid #e5e7eb;
        border-radius: 3px;
        background: #f9fafb;
        font: inherit;
        cursor: pointer;
        color: #111827;
      }
      button.primary {
        background: #4338ca;
        border-color: #4338ca;
        color: #fff;
      }
      .muted {
        color: #6b7280;
      }
      .mono {
        font-family: 'Cascadia Mono', 'Consolas', monospace;
      }
      .scanwrap {
        background: #f9fafb;
        padding: 10px;
        border: 1px solid #e5e7eb;
      }
      .rail {
        flex: 0 0 260px;
      }
      footer {
        padding: 10px 20px;
        color: #6b7280;
        font-size: 10px;
        border-top: 1px solid #e5e7eb;
      }
    </style>
  </head>
  <body data-corpus-id="syn-ins-claim">
    <header class="bar">
      <div class="brand">Sampoorna General Insurance</div>
      <div>Claim intimation</div>
    </header>
    <main>
      <h1>Intimate a claim</h1>
      <fieldset>
        <legend>Policy</legend>
        <div class="grid">
          <div class="f">
            <label>Policy number</label
            ><input
              type="text"
              value="support@example.in"
              data-el="1"
              data-neg="EMAIL"
              data-neg-why="a support desk, not a person"
            />
          </div>
          <div class="f">
            <label>Policyholder</label
            ><input type="text" value="Rekha Gowda" data-el="1" data-pii="PERSON" />
          </div>
          <div class="f">
            <label>Date of birth</label
            ><input type="text" value="20/12/1976" data-el="1" data-pii="DOB" />
          </div>
          <div class="f">
            <label>Registered mobile</label
            ><input type="tel" value="08399 882660" data-el="1" data-pii="PHONE" />
          </div>
        </div>
      </fieldset>
      <fieldset>
        <legend>Incident</legend>
        <div class="f">
          <label>Date of incident</label
          ><input
            type="text"
            value="noreply@example.in"
            data-el="1"
            data-neg="EMAIL"
            data-neg-why="an unattended mailbox"
          />
        </div>
        <div class="f">
          <label>What happened</label>
          <textarea rows="3" data-el="1">
Vehicle KA49 20067860504 was damaged in the
        parking area.</textarea>
        </div>
      </fieldset>
      <fieldset>
        <legend>Settlement</legend>
        <div class="grid">
          <div class="f">
            <label>Account number</label
            ><input type="text" value="96628994134" data-el="1" data-pii="ACCOUNT" />
          </div>
          <div class="f">
            <label>IFSC</label
            ><input type="text" value="KKBK0946443" data-el="1" data-pii="IFSC" />
          </div>
          <div class="f">
            <label>PAN</label
            ><input type="text" value="WJRPG2281V" data-el="1" data-pii="PAN" />
          </div>
          <div class="f">
            <label>Driving licence</label
            ><input type="text" value="MH63 20125631508" data-el="1" data-pii="LICENCE" />
          </div>
        </div>
      </fieldset>
      <div class="actions">
        <button class="" data-el="1">Save draft</button
        ><button class="primary" data-el="1">Intimate claim</button>
      </div>
    </main>
  </body>
</html>
