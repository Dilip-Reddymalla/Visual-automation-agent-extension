<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nominee Declaration</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f5f5f4;
        color: #1c1917;
        font:
          15px/1.5 Georgia,
          'Times New Roman',
          serif;
      }
      a {
        color: #7c2d12;
      }
      header.bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 20px;
        background: #faf9f7;
        border-bottom: 2px solid #7c2d12;
      }
      .brand {
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .crumb {
        font-size: 12px;
        color: #78716c;
        padding: 6px 20px;
      }
      main {
        padding: 16px 20px;
        max-width: 1180px;
      }
      .cols {
        display: flex;
        gap: 16px;
        align-items: flex-start;
      }
      .cols > .side {
        flex: 0 0 190px;
      }
      .cols > .pane {
        flex: 1 1 auto;
        min-width: 0;
      }
      nav.side a {
        display: block;
        padding: 9px 10px;
        text-decoration: none;
        color: #1c1917;
        border-left: 3px solid transparent;
      }
      nav.side a[aria-current] {
        border-left-color: #7c2d12;
        background: #faf9f7;
      }
      section {
        margin-bottom: 16px;
      }
      fieldset {
        border: 1px solid #d6d3d1;
        border-radius: 4px;
        padding: 13px;
        margin: 0 0 16px;
      }
      legend {
        padding: 0 6px;
        font-weight: 700;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #78716c;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 12px;
      }
      h2 {
        font-size: 18px;
        margin: 0 0 12px;
      }
      h3 {
        font-size: 16px;
        margin: 0 0 6px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .grid.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .f {
        margin-bottom: 12px;
      }
      label {
        display: block;
        font-size: 13px;
        color: #78716c;
        margin-bottom: 3px;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 9px 9px;
        border: 1px solid #d6d3d1;
        border-radius: 3px;
        font: inherit;
        background: #fff;
        color: #1c1917;
      }
      input[readonly] {
        background: #faf9f7;
      }
      .hint {
        font-size: 12px;
        color: #78716c;
        margin-top: 2px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th,
      td {
        text-align: left;
        padding: 9px 8px;
        border-bottom: 1px solid #d6d3d1;
        vertical-align: top;
      }
      th {
        background: #faf9f7;
        font-weight: 600;
        color: #78716c;
      }
      td.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      dl.kv {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 4px 12px;
        margin: 0;
      }
      dl.kv dt {
        color: #78716c;
        font-size: 13px;
      }
      dl.kv dd {
        margin: 0;
      }
      .card {
        border: 1px solid #d6d3d1;
        border-radius: 6px;
        padding: 13px;
        margin-bottom: 12px;
        background: #fff;
      }
      .pill {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 10px;
        background: #faf9f7;
        color: #7c2d12;
        font-size: 12px;
        border: 1px solid #d6d3d1;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      button {
        padding: 9px 14px;
        border: 1px solid #d6d3d1;
        border-radius: 3px;
        background: #faf9f7;
        font: inherit;
        cursor: pointer;
        color: #1c1917;
      }
      button.primary {
        background: #7c2d12;
        border-color: #7c2d12;
        color: #fff;
      }
      .muted {
        color: #78716c;
      }
      .mono {
        font-family: 'Cascadia Mono', 'Consolas', monospace;
      }
      .scanwrap {
        background: #faf9f7;
        padding: 16px;
        border: 1px solid #d6d3d1;
      }
      .rail {
        flex: 0 0 260px;
      }
      footer {
        padding: 16px 20px;
        color: #78716c;
        font-size: 12px;
        border-top: 1px solid #d6d3d1;
      }
    </style>
  </head>

      <div class="brand">Insurance Nominee Update</div>
      <div></div>
    </header>
    <main>
      <h1>Nominee declaration</h1>

          </div>
          <div class="f">
            <label>Policy number</label
            ><input
              type="text"
              value="Salem"
              data-el="1"
              data-neg="PERSON"
              data-neg-why="a place name that is also a common given or family name"
            />

          <div class="f">
            <label>Date of birth</label
            ><input type="text" value="26/10/1969" data-el="1" data-pii="DOB" />
          </div>
          <div class="f">
            <label>PAN</label
            ><input type="text" value="SBSPP3593H" data-el="1" data-pii="PAN" />
          </div>
        </div>
      </fieldset>
      <fieldset>
