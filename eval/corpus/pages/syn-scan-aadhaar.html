<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DigiLocker — Aadhaar</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f5f5f4;
        color: #1c1917;
        font:
          16px/1.7 Georgia,
          'Times New Roman',
          serif;
      }
      a {
        color: #7c2d12;
      }
      header.bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 20px;
        background: #faf9f7;
        border-bottom: 2px solid #7c2d12;
      }
      .brand {
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .crumb {
        font-size: 13px;
        color: #78716c;
        padding: 6px 20px;
      }
      main {
        padding: 24px 20px;
        max-width: 1180px;
      }
      .cols {
        display: flex;
        gap: 24px;
        align-items: flex-start;
      }
      .cols > .side {
        flex: 0 0 190px;
      }
      .cols > .pane {
        flex: 1 1 auto;
        min-width: 0;
      }
      nav.side a {
        display: block;
        padding: 13px 10px;
        text-decoration: none;
        color: #1c1917;
        border-left: 3px solid transparent;
      }
      nav.side a[aria-current] {
        border-left-color: #7c2d12;
        background: #faf9f7;
      }
      section {
        margin-bottom: 24px;
      }
      fieldset {
        border: 1px solid #d6d3d1;
        border-radius: 4px;
        padding: 17px;
        margin: 0 0 24px;
      }
      legend {
        padding: 0 6px;
        font-weight: 700;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #78716c;
      }
      h1 {
        font-size: 23px;
        margin: 0 0 20px;
      }
      h2 {
        font-size: 19px;
        margin: 0 0 20px;
      }
      h3 {
        font-size: 17px;
        margin: 0 0 6px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }
      .grid.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .f {
        margin-bottom: 20px;
      }
      label {
        display: block;
        font-size: 14px;
        color: #78716c;
        margin-bottom: 3px;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 13px 9px;
        border: 1px solid #d6d3d1;
        border-radius: 3px;
        font: inherit;
        background: #fff;
        color: #1c1917;
      }
      input[readonly] {
        background: #faf9f7;
      }
      .hint {
        font-size: 13px;
        color: #78716c;
        margin-top: 2px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 15px;
      }
      th,
      td {
        text-align: left;
        padding: 13px 8px;
        border-bottom: 1px solid #d6d3d1;
        vertical-align: top;
      }
      th {
        background: #faf9f7;
        font-weight: 600;
        color: #78716c;
      }
      td.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      dl.kv {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 4px 20px;
        margin: 0;
      }
      dl.kv dt {
        color: #78716c;
        font-size: 14px;
      }
      dl.kv dd {
        margin: 0;
      }
      .card {
        border: 1px solid #d6d3d1;
        border-radius: 6px;
        padding: 17px;
        margin-bottom: 20px;
        background: #fff;
      }
      .pill {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 10px;
        background: #faf9f7;
        color: #7c2d12;
        font-size: 13px;
        border: 1px solid #d6d3d1;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 20px;
        flex-wrap: wrap;
      }
      button {
        padding: 13px 14px;
        border: 1px solid #d6d3d1;
        border-radius: 3px;
        background: #faf9f7;
        font: inherit;
        cursor: pointer;
        color: #1c1917;
      }
      button.primary {
        background: #7c2d12;
        border-color: #7c2d12;
        color: #fff;
      }
      .muted {
        color: #78716c;
      }
      .mono {
        font-family: 'Cascadia Mono', 'Consolas', monospace;
      }
      .scanwrap {
        background: #faf9f7;
        padding: 24px;
        border: 1px solid #d6d3d1;
      }
      .rail {
        flex: 0 0 260px;
      }
      footer {
        padding: 24px 20px;
        color: #78716c;
        font-size: 13px;
        border-top: 1px solid #d6d3d1;
      }
    </style>
  </head>
