<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Candidate Profile</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #ffffff;
        color: #111827;
        font:
          18px/1.7 system-ui,
          sans-serif;
      }
      a {
        color: #4338ca;
      }
      header.bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 20px;
        background: #f9fafb;
        border-bottom: 2px solid #4338ca;
      }
      .brand {
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .crumb {
        font-size: 15px;
        color: #6b7280;
        padding: 6px 20px;
      }
      main {
        padding: 24px 20px;
        max-width: 1180px;
      }
      .cols {
        display: flex;
        gap: 24px;
        align-items: flex-start;
      }
      .cols > .side {
        flex: 0 0 190px;
      }
      .cols > .pane {
        flex: 1 1 auto;
        min-width: 0;
      }
      nav.side a {
        display: block;
        padding: 13px 10px;
        text-decoration: none;
        color: #111827;
        border-left: 3px solid transparent;
      }
      nav.side a[aria-current] {
        border-left-color: #4338ca;
        background: #f9fafb;
      }
      section {
        margin-bottom: 24px;
      }
      fieldset {
        border: 1px solid #e5e7eb;
        border-radius: 4px;
        padding: 17px;
        margin: 0 0 24px;
      }
      legend {
        padding: 0 6px;
        font-weight: 700;
        font-size: 15px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #6b7280;
      }
      h1 {
        font-size: 25px;
        margin: 0 0 20px;
      }
      h2 {
        font-size: 21px;
        margin: 0 0 20px;
      }
      h3 {
        font-size: 19px;
        margin: 0 0 6px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }
      .grid.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .f {
        margin-bottom: 20px;
      }
      label {
        display: block;
        font-size: 16px;
        color: #6b7280;
        margin-bottom: 3px;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 13px 9px;
        border: 1px solid #e5e7eb;
        border-radius: 3px;
        font: inherit;
        background: #fff;
        color: #111827;
      }
      input[readonly] {
        background: #f9fafb;
      }
      .hint {
        font-size: 15px;
        color: #6b7280;
        margin-top: 2px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 17px;
      }
      th,
      td {
        text-align: left;
        padding: 13px 8px;
        border-bottom: 1px solid #e5e7eb;
        vertical-align: top;
      }
      th {
        background: #f9fafb;
        font-weight: 600;
        color: #6b7280;
      }
      td.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      dl.kv {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 4px 20px;
        margin: 0;
      }
      dl.kv dt {
        color: #6b7280;
        font-size: 16px;
      }
      dl.kv dd {
        margin: 0;
      }
      .card {
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        padding: 17px;
        margin-bottom: 20px;
        background: #fff;
      }
      .pill {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 10px;
        background: #f9fafb;
        color: #4338ca;
        font-size: 15px;
        border: 1px solid #e5e7eb;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 20px;
        flex-wrap: wrap;
      }
      button {
        padding: 13px 14px;
        border: 1px solid #e5e7eb;
        border-radius: 3px;
        background: #f9fafb;
        font: inherit;
        cursor: pointer;
        color: #111827;
      }
      button.primary {
        background: #4338ca;
        border-color: #4338ca;
        color: #fff;
      }
      .muted {
        color: #6b7280;
      }
      .mono {
        font-family: 'Cascadia Mono', 'Consolas', monospace;
      }
      .scanwrap {
        background: #f9fafb;
        padding: 24px;
        border: 1px solid #e5e7eb;
      }
      .rail {
        flex: 0 0 260px;
      }
      footer {
        padding: 24px 20px;
        color: #6b7280;
        font-size: 15px;
        border-top: 1px solid #e5e7eb;
      }
    </style>
  </head>
  <body data-corpus-id="rep-talent-profile">
    <header class="bar">
      <div class="brand">Talent Network</div>
      <div>Profile</div>
    </header>
    <main>
      <h1><span>Lakshmi Menon</span></h1>
      <p class="muted"><span>Chelsea</span> · open to work</p>
      <div class="card">
        <h3>Contact</h3>
        <dl class="kv">
          <dt>Email</dt>
          <dd><span>lakshmi.menon@mail.example.org</span></dd>
          <dt>Phone</dt>
          <dd><span>09984 917428</span></dd>
          <dt>Location</dt>
          <dd><span>Preston</span></dd>
          <dt>Passport</dt>
          <dd><span>L9858040</span></dd>
        </dl>
      </div>
      <div class="card">
        <h3>Experience</h3>
        <p>
          <strong><span>Kaveri Textiles Pvt Ltd</span></strong> — Engineer,
          <span>ABCDX1234Z</span> to present. Reported to <span>Pooja Kulkarni</span>.
        </p>
      </div>
      <div class="actions">
        <button class="">Message</button><button class="primary">Shortlist</button>
      </div>
    </main>
  </body>
</html>
